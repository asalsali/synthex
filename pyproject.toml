[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synthex"
version = "0.1.0"
description = "Multi-generational agent code synthesis -- decompiled C to clean code through iterative LLM refinement"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "openai>=1.0",
]

[project.optional-dependencies]
dev = ["pytest"]
api = ["fastapi>=0.100", "uvicorn[standard]>=0.20", "pydantic>=2.0"]

[project.scripts]
synthex = "synthex.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
